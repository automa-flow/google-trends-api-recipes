name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python
        run: |
          python -m pip install pytest==8.3.3
          python -m pytest python -q
      - name: Node.js
        working-directory: node
        run: node --test
      - name: Bash
        run: |
          bash -n curl/run.sh
          jq -c '.[]' fixtures/sample_output.json > /tmp/items.jsonl
          test "$(bash curl/run.sh --summarize /tmp/items.jsonl | jq -c '[.rows, .newSignals, .partialOrFailedRows]')" = '[9,2,1]'
